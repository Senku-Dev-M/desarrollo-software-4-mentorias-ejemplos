services:
  # =========================================================================
  # 1. Database: PostgreSQL 16
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: games_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gamesdb}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gamesdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. Backend: .NET 8 Web API (Clean Architecture)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: games_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-gamesdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Cors__AllowedOrigins__1: "http://127.0.0.1:8080"
      Cors__AllowedOrigins__2: "http://localhost:3000"
      Cors__AllowedOrigins__3: "http://localhost:5500"
      Database__ApplyMigrationsOnStartup: "true"
      Swagger__Enable: "true"
    depends_on:
      postgres:
        condition: service_healthy

  # Note: Frontend is NOT dockerized. It runs as an independent SPA client
  # on your machine (e.g. via python -m http.server 8080 or live-server)
  # and consumes http://localhost:5000/api directly.

volumes:
  postgres_data:
    name: games_postgres_data
